<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nownownow.now · Find a time that works</title>
    <meta
      name="description"
      content="Share a few dates and times, collect everyone's availability. No accounts."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nownownow.now" />
    <meta property="og:title" content="nownownow.now · Find a time that works" />
    <meta property="og:description" content="Share a few dates and times, collect everyone's availability. No accounts." />
    <meta property="og:url" content="https://nownownow.now/" />
    <meta property="og:image" content="https://nownownow.now/assets/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="nownownow.now" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#071704" />
    <script src="/assets/js/colors.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/hanken-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/" aria-label="nownownow.now home" data-logo></a>
    </header>

    <main class="container container-narrow">
      <h1 class="sr-only">Find a time that works</h1>

      <section>
        <h2 class="sr-only">Create an event</h2>
        <form id="create-form" class="form form-inline" novalidate>
          <div>
            <label class="sr-only" for="title">Event name</label>
            <input
              id="title"
              type="text"
              maxlength="120"
              placeholder="Event Name"
              autocomplete="off"
              required
            />
          </div>
          <div>
            <label class="sr-only" for="description">Details (optional)</label>
            <textarea
              id="description"
              rows="1"
              maxlength="1000"
              placeholder="Details"
            ></textarea>
          </div>
          <div
            id="options-editor"
            class="field-control"
            role="group"
            aria-label="Dates and times"
          ></div>
          <div>
            <label class="sr-only" for="timezone">Time zone</label>
            <div class="select"><select id="timezone"></select></div>
          </div>
          <div class="form-actions">
            <p id="create-error" class="form-error" hidden></p>
            <button id="create-btn" class="btn btn-primary btn-lg" type="submit">
              Create Event
            </button>
          </div>
        </form>
      </section>

      <section id="my-events" class="section" hidden>
        <h2 class="section-title">Your Events</h2>
        <div class="field-row">
          <p class="field-label">Remembered in this browser only</p>
          <div class="field-control">
            <ul id="my-events-list" class="event-list"></ul>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="/assets/js/logo.js"></script>
    <script type="module" src="/assets/js/create.js"></script>
  </body>
</html>
