<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>nownownow.now</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="nownownow.now" />
    <meta property="og:title" content="Pick the times that work for you" />
    <meta property="og:description" content="Mark your availability on nownownow.now. No account needed." />
    <meta property="og:image" content="https://nownownow.now/assets/share-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="nownownow.now" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#071704" />
    <script src="/assets/js/colors.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="/assets/fonts/hanken-grotesk-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="/" aria-label="nownownow.now home" data-logo></a>
    </header>

    <main class="container">
      <p id="loading" class="loading">Loading…</p>

      <div id="not-found" class="center-card" hidden>
        <h1>Event not found</h1>
        <p id="not-found-msg">
          This link may be mistyped, or the event was deleted.
        </p>
      </div>

      <div id="event" hidden>
        <header class="page-head">
          <div class="eyebrow">
            <span id="status-pill" class="pill"></span>
            <span id="tz-note" class="tz"></span>
          </div>
          <h1 id="ev-title"></h1>
          <p id="ev-desc" class="desc" hidden></p>
        </header>

        <div id="closed-banner" class="banner" hidden>
          This event is closed and no longer accepting responses.
        </div>

        <form id="response-form" class="form" novalidate>
          <div>
            <label for="name" class="sr-only">Your name</label>
            <input
              id="name"
              class="input-xl"
              type="text"
              maxlength="60"
              autocomplete="name"
              placeholder="Your Name"
              required
            />
          </div>
          <div
            id="slots"
            class="slot-groups"
            role="group"
            aria-label="Which times work for you?"
          ></div>
          <div class="form-actions">
            <p id="form-error" class="form-error" hidden></p>
            <button id="submit-btn" class="btn btn-primary btn-lg" type="submit">
              Submit Availability
            </button>
            <p id="saved-note" class="saved-note" hidden></p>
            <p id="not-you" class="hint" hidden>
              Responding as <span id="not-you-name"></span>. Not you?
              <button type="button" class="link-btn" id="new-response">
                Start a new response
              </button>
            </p>
          </div>
        </form>

        <section id="responses-section" class="section" hidden>
          <div class="section-head">
            <h2>Results</h2>
            <span id="resp-count" class="hint meta"></span>
          </div>
          <div id="ranking"></div>
          <div id="grid" class="table-wrap"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/assets/js/logo.js"></script>
    <script type="module" src="/assets/js/event.js"></script>
  </body>
</html>
